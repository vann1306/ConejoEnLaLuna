<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultura Japonesa · En construcción</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sen:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Sen', sans-serif;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .contenedor {
            text-align: center;
            max-width: 600px;
        }
        
        img {
            width: 100%;
            max-width: 400px;
            margin-bottom: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        
        h2 {
            color: white;
            font-size: 2rem;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        
        p {
            color: rgba(255,255,255,0.8);
            font-size: 1.2rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .boton-regreso {
            display: inline-block;
            padding: 15px 40px;
            background: #D46B3A;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(212, 107, 58, 0.3);
        }
        
        .boton-regreso:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(212, 107, 58, 0.5);
        }
        
        .boton-regreso:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <img src="img/enproceso.png" alt="En construcción">
        <h2>Cultura Japonesa</h2>
        <p>Estamos preparando esta  historia para ti.<br>¡Muy pronto podrás descubrirla!</p>
        <a href="estante-culturas.html" class="boton-regreso">← Volver al estante</a>
    </div>
</body>
</html>
